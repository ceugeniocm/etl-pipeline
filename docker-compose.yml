version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${ETL_DB_NAME:-etl_db}
      MYSQL_ROOT_PASSWORD: ${ETL_DB_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${ETL_DB_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  etl-pipeline:
    build: .
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: config.json

volumes:
  mysql_data:
